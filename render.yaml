services:
  - type: web
    name: campus-ai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        sync: false
      # Optional legacy MongoDB during migration; leave unset if not used
      - key: MONGODB_URI
        sync: false
      # Paste DATABASE_URL as the raw connection string only (no surrounding quotes, no leading/trailing spaces)
